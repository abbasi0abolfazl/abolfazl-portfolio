    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }

          var storedLang = localStorage.getItem('portfolio_lang');
          var isIranTimezone = false;
          try {
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            isIranTimezone = tz.indexOf('Tehran') !== -1;
          } catch (e) {}
          var isPersianNav = (navigator.languages && navigator.languages.some(function(l) { return l.indexOf('fa') === 0; })) ||
                             (navigator.language && navigator.language.indexOf('fa') === 0);

          var activeLang = storedLang || (isIranTimezone || isPersianNav ? 'fa' : 'en');
          document.documentElement.setAttribute('lang', activeLang);
          document.documentElement.setAttribute('dir', activeLang === 'fa' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
